    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1f1212, #0d0d0d); /* พื้นหลังไล่เฉดสีมืดโทนแดง-ดำ */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* การ์ดโปรไฟล์หลักสไตล์ Cyber Glow */
        .profile-card {
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 71, 87, 0.2);
            border-radius: 32px;
            width: 100%;
            max-width: 440px;
            padding: 45px 30px 35px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 71, 87, 0.05);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .profile-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 71, 87, 0.6);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 71, 87, 0.2);
        }
