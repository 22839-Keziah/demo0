    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: #121212; /* พื้นหลังสีดำโมเดิร์น */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* การ์ดโปรไฟล์หลัก */
        .profile-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* ส่วนหัวรูปภาพจำลอง */
        .avatar-container {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #333, #000);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #ff4757; /* ตัดด้วยสีแดงกะเพราเล็กน้อยให้เด่น */
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
        }
